services:
  - type: web
    name: attachai-platform
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn advanced_rag.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: attachai-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: NODE_ENV
        value: production
      - key: ADMIN_API_KEY
        generateValue: true
      - key: RAG_DATA_DIR
        value: /var/data/.rag_data
      - key: RAG_KNOWLEDGE_DIR
        value: /var/data/knowledge
      - key: RAG_LLM_PROVIDER
        value: none
      - key: RAG_EMBEDDING_MODEL
        value: lexical
      - key: ATTACHAI_SECURE_LEGACY_API
        value: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_PROVIDER_TYPE
        value: none
